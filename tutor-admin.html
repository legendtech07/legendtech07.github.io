<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Admin Panel - Legend Tech Academy</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tutor-admin.css">
    <link rel="icon" href="logo.png">
</head>
<body>
    <!-- Loader -->
    <div class="loader-container" id="loader">
        <div class="loader">
            <div class="loader-circle"></div>
            <div class="loader-circle"></div>
            <div class="loader-circle"></div>
        </div>
        <div class="loader-text">Loading Admin Panel...</div>
    </div>

    <!-- Auth Container -->
    <div class="auth-container" id="auth-container">
        <div class="auth-box">
            <h2><i class="fas fa-user-shield"></i> Admin Login</h2>
            
            <form class="auth-form active" id="login-form">
                <div class="form-group">
                    <label for="login-email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="login-email" placeholder="Enter admin email" required>
                </div>
                
                <div class="form-group">
                    <label for="login-password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="login-password" placeholder="Enter password" required>
                </div>
                
                <button type="submit" class="btn">
                    <i class="fas fa-sign-in-alt"></i> Login as Admin
                </button>
                
                <div class="auth-footer">
                    <a href="tutor.html">← Back to Tutor Panel</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin-container" id="admin-container" style="display: none;">
        <header>
            <div class="logo">
                <img src="logo.png" alt="Legend Tech Logo">
                <span>Admin Panel</span>
            </div>
            
            <div class="admin-info">
                <div class="admin-badge">
                    <i class="fas fa-crown" style="color: var(--gold);"></i>
                    <span id="admin-name">Admin</span>
                </div>
                
                <button class="logout-btn" id="logout-btn" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <main class="main-content">
            <!-- Dashboard Stats -->
            <section class="section active" id="dashboard-section">
                <h1 class="section-title">
                    <i class="fas fa-tachometer-alt"></i> Admin Dashboard
                </h1>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-chalkboard-teacher"></i>
                        </div>
                        <div class="stat-number" id="total-tutors">0</div>
                        <div class="stat-label">Total Tutors</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-id-card"></i>
                        </div>
                        <div class="stat-number" id="verified-tutors">0</div>
                        <div class="stat-label">Verified IDs</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-star"></i>
                        </div>
                        <div class="stat-number" id="total-tp">0</div>
                        <div class="stat-label">Total TP</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-layer-group"></i>
                        </div>
                        <div class="stat-number" id="rank-distribution">0</div>
                        <div class="stat-label">Active Ranks</div>
                    </div>
                </div>

                <!-- Rank Distribution Chart -->
                <div class="analytics-card">
                    <h3><i class="fas fa-chart-pie"></i> Tutor Rank Distribution</h3>
                    <div class="chart-container">
                        <canvas id="rankChart"></canvas>
                    </div>
                </div>

                <!-- Search and Filter -->
                <div class="search-section">
                    <div class="search-container">
                        <input type="text" id="tutor-search" placeholder="Search tutors by name, email, or serial...">
                        <i class="fas fa-search"></i>
                    </div>
                    
                    <select id="rank-filter" class="filter-select">
                        <option value="">All Ranks</option>
                        <option value="Iron">Iron</option>
                        <option value="Bronze">Bronze</option>
                        <option value="Silver">Silver</option>
                        <option value="Gold">Gold</option>
                        <option value="Platinum">Platinum</option>
                        <option value="Ruby">Ruby</option>
                        <option value="Diamond">Diamond</option>
                        <option value="Elite">Elite</option>
                    </select>
                    
                    <select id="verification-filter" class="filter-select">
                        <option value="">All Status</option>
                        <option value="verified">Verified</option>
                        <option value="pending">Pending</option>
                    </select>
                </div>
            </section>

            <!-- Tutors List Section -->
            <section class="section active" id="tutors-section">
                <div class="tutors-list" id="tutors-list">
                    <!-- Tutors will be loaded here -->
                </div>
            </section>
        </main>

        <!-- Tutor Details Modal -->
        <div class="modal" id="tutor-modal">
            <div class="modal-content modal-lg">
                <div class="modal-header">
                    <h3 class="modal-title"><i class="fas fa-user-edit"></i> Tutor Details</h3>
                    <button class="modal-close" id="close-tutor-modal">&times;</button>
                </div>
                
                <div class="modal-body" id="tutor-details-content">
                    <!-- Tutor details will be loaded here -->
                </div>
                
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="print-id-btn">
                        <i class="fas fa-print"></i> Print ID Card
                    </button>
                    <button class="btn" id="save-tutor-btn">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>
            </div>
        </div>

        <!-- ID Card Preview Modal -->
        <div class="modal" id="idcard-modal">
            <div class="modal-content modal-sm">
                <div class="modal-header">
                    <h3 class="modal-title"><i class="fas fa-id-card"></i> Tutor ID Card</h3>
                    <button class="modal-close" id="close-idcard-modal">&times;</button>
                </div>
                
                <div class="modal-body" id="idcard-content">
                    <!-- ID card will be loaded here -->
                </div>
                
                <div class="modal-footer">
                    <button class="btn" id="download-id-btn">
                        <i class="fas fa-download"></i> Download ID
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="tutor-admin.js"></script>
</body>
</html>
